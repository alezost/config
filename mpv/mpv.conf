write-filename-in-watch-later-config
volume=80

msg-module
msg-level=ffmpeg/video=error,ffmpeg/demuxer=error

# does not work!
background=tiles

# no-osd-bar
# osd-on-seek=no
osd-duration=2000
osd-color='#23B13E'
osd-font='DejaVu Sans:style=Bold'
osd-font-size=50
osd-shadow-offset=2

# Do not display image attachments when playing audio files.
audio-display=no

# Without this option, mpv disables/enables screensaver on every pause.
stop-screensaver=no

# On Screen Controller
osc=no
script-opts=osc-timetotal=yes

[video]
quiet
speed=1.3

[slow]
profile=video
speed=1.1

[loud]
profile=video
volume=130

[url]
profile=video
demuxer-max-bytes=80MiB
demuxer-max-back-bytes=80MiB
ytdl-format=best[height=720]/bv[height=720]+ba
ytdl-raw-options=format-sort=+fps,format-sort=lang

[audio]
quiet
